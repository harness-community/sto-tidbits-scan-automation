# ─────────────────────────────────────────────────────────────────────────────
# STO Tidbit: Scan Automation
#
# Flow (ONE stage, three steps in order):
#   1. Code scans  : Gitleaks + Semgrep run IN PARALLEL on the repo
#   2. Build/Push  : Dockerfile at repo root -> Harness Artifact Registry (HAR)
#   3. Image scan  : Aqua Trivy scans the image that was just pushed to HAR
#
# Scanners used (and nothing else): Gitleaks, Semgrep, Aqua Trivy.
# Docs:
#   Gitleaks  https://developer.harness.io/security-testing-orchestration/use-sto/sto-scanner-configuration/gitleaks-scanner-reference
#   Semgrep   https://developer.harness.io/security-testing-orchestration/use-sto/sto-scanner-configuration/semgrep/semgrep-scanner-reference
#   Trivy     https://developer.harness.io/security-testing-orchestration/use-sto/sto-scanner-configuration/trivy/aqua-trivy-scanner-reference
#   HAR + CI  https://developer.harness.io/artifact-registry/use-artifact-registry/platform-integrations/ci-ar-integrations
# ─────────────────────────────────────────────────────────────────────────────
pipeline:
  name: parallel-security-scan
  identifier: parallel_security_scan
  projectIdentifier: <+input>
  orgIdentifier: <+input>
  tags: {}

  # Codebase = this repo. Stages with `cloneCodebase: true` clone it into /harness.
  # The sample app (app.py, requirements.txt, Dockerfile) lives at the repo root,
  # so /harness IS the app directory.
  properties:
    ci:
      codebase:
        repoName: <+input> # e.g. sto-tidbits-scan-automation
        build: <+input> # branch / tag / PR chosen at run time

  # ── Pipeline variables (shared by all stages) ────────────────────────────────
  variables:
    - name: HAR_REGISTRY
      type: String
      description: Name of the Docker registry in Harness Artifact Registry (e.g., sample-docker-registry)
      required: true
      value: <+input>
    - name: IMAGE_NAME
      type: String
      description: Image name inside the registry
      required: false
      value: sto-sample-app
    - name: IMAGE_TAG
      type: String
      description: Image tag. Defaults to the pipeline execution number so every run is unique
      required: false
      value: <+pipeline.sequenceId>

  stages:
    # A CI (Build) stage can run STO scan steps alongside build steps, so the whole
    # flow fits in one stage on Harness Cloud — no extra stages or infrastructure.
    - stage:
        name: Scan and Build
        identifier: scan_and_build
        description: Gitleaks + Semgrep in parallel, build and push to HAR, then Trivy image scan
        type: CI
        spec:
          cloneCodebase: true # Scanners and the Docker build need the source in /harness
          platform:
            os: Linux
            arch: Amd64
          runtime: # Harness Cloud — no infrastructure setup required
            type: Cloud
            spec: {}
          execution:
            steps:
              # ── Step 1: code scans, run in parallel ────────────────────────────
              - stepGroup:
                  name: Parallel Code Scanners
                  identifier: parallel_code_scanners
                  steps:
                    # `parallel:` makes every child step start at the same time.
                    - parallel:
                        # Gitleaks: hardcoded secrets (app.py has a fake token)
                        - step:
                            type: Gitleaks
                            name: gitleaks_secrets_scan
                            identifier: gitleaks_secrets_scan
                            spec:
                              mode: orchestration # run the scan AND ingest results in one step
                              config: default
                              target:
                                type: repository
                                detection: manual
                                name: sto-tidbits-scan-automation
                                variant: <+codebase.branch> # STO tracks findings per branch
                              advanced:
                                log:
                                  level: info
                                fail_on_severity: critical # Gitleaks has no true severities; keep the gate permissive for the demo

                        # Semgrep: static analysis (SQLi, command injection, debug mode)
                        - step:
                            type: Semgrep
                            name: semgrep_sast_scan
                            identifier: semgrep_sast_scan
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: repository
                                detection: manual
                                name: sto-tidbits-scan-automation
                                variant: <+codebase.branch>
                              advanced:
                                log:
                                  level: info
                                fail_on_severity: none # fail the pipeline on High or Critical findings

              # ── Step 2: build the Dockerfile and push to Harness Artifact Registry ─
              # NOTE: With HAR selected as the registry type, no Docker connector is
              # needed — the pipeline's own identity authenticates to HAR.
              # NOTE: The Harness docs describe this via the UI ("Build and Push an image
              # to Docker Registry" -> registry type "Harness Artifact Registry") but do not
              # publish the YAML. If validation fails on `registryRef`, build the step once
              # in the Pipeline Studio visual editor and copy the generated YAML.
              - step:
                  type: BuildAndPushDockerRegistry
                  name: build_and_push_to_har
                  identifier: build_and_push_to_har
                  spec:
                    registryRef: <+pipeline.variables.HAR_REGISTRY> # HAR registry to push to
                    repo: <+pipeline.variables.IMAGE_NAME> # image name inside the registry
                    tags:
                      - <+pipeline.variables.IMAGE_TAG>
                    dockerfile: Dockerfile # root-level Dockerfile of the sample app
                    context: . # repo root = build context

              # ── Step 3: scan the pushed image with Aqua Trivy ──────────────────
              # No Docker-in-Docker background step: on Harness Cloud Trivy pulls the
              # image straight from the registry (image.type: docker_v2).
              - step:
                  type: AquaTrivy
                  name: trivy_container_scan
                  identifier: trivy_container_scan
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: container
                      detection: manual
                      name: <+pipeline.variables.IMAGE_NAME>
                      variant: <+pipeline.variables.IMAGE_TAG>
                    image:
                      type: harness # pull from a HAR registry
                      registry: <+pipeline.variables.HAR_REGISTRY>
                      image_path: <+pipeline.variables.IMAGE_NAME>:<+pipeline.variables.IMAGE_TAG>
                      tag: <+pipeline.variables.IMAGE_TAG>
                    privileged: true
                    advanced:
                      log:
                        level: info
                      fail_on_severity: none # block only on Critical CVEs
